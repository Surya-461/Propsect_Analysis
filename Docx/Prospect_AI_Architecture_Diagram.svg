<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#172554" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="emeraldCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="indigoCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="850" fill="#0f172a"/>
  <rect x="20" y="20" width="1160" height="810" rx="16" fill="url(#headerGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(50, 45)">
    <rect width="42" height="42" rx="10" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="21" y="27" font-size="20" font-weight="bold" fill="#60a5fa" text-anchor="middle">PA</text>
    <text x="56" y="25" font-size="22" font-weight="bold" fill="#f8fafc">Prospect AI — Platform System Architecture</text>
    <text x="56" y="42" font-size="12" font-family="monospace" fill="#94a3b8">Enterprise B2B Underwriting &amp; Prospect Intelligence Platform</text>
  </g>

  <!-- Badges -->
  <g transform="translate(820, 45)">
    <rect x="0" y="0" width="105" height="26" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <text x="52" y="17" font-size="10" font-weight="bold" fill="#93c5fd" text-anchor="middle">FastAPI 0.110+</text>

    <rect x="115" y="0" width="125" height="26" rx="6" fill="#581c87" stroke="#a855f7" stroke-width="1"/>
    <text x="177" y="17" font-size="10" font-weight="bold" fill="#e9d5ff" text-anchor="middle">Gemini 3.6 Flash</text>

    <rect x="250" y="0" width="95" height="26" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1"/>
    <text x="297" y="17" font-size="10" font-weight="bold" fill="#a7f3d0" text-anchor="middle">React 18 + Vite</text>
  </g>

  <!-- LAYER 1: CLIENT PRESENTATION -->
  <g transform="translate(50, 110)" filter="url(#glow)">
    <rect width="340" height="200" rx="12" fill="url(#blueCard)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="16" y="26" font-size="12" font-weight="bold" fill="#60a5fa" letter-spacing="1">1. PRESENTATION LAYER (REACT 18)</text>
    
    <rect x="16" y="40" width="308" height="34" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="26" y="61" font-size="12" font-weight="600" fill="#f1f5f9">Frontend Dashboard (App.jsx)</text>

    <g transform="translate(16, 82)">
      <rect width="148" height="46" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.4"/>
      <text x="10" y="20" font-size="11" font-weight="600" fill="#93c5fd">SearchForm.jsx</text>
      <text x="10" y="34" font-size="9" fill="#94a3b8">Target entity input</text>

      <rect x="160" width="148" height="46" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.4"/>
      <text x="170" y="20" font-size="11" font-weight="600" fill="#93c5fd">ReportView.jsx</text>
      <text x="170" y="34" font-size="9" fill="#94a3b8">Underwriting report UI</text>
    </g>

    <g transform="translate(16, 136)">
      <rect width="148" height="46" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.4"/>
      <text x="10" y="20" font-size="11" font-weight="600" fill="#93c5fd">ChatInterface.jsx</text>
      <text x="10" y="34" font-size="9" fill="#94a3b8">Interactive assistant</text>

      <rect x="160" width="148" height="46" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.4"/>
      <text x="170" y="20" font-size="11" font-weight="600" fill="#93c5fd">ProgressTracker.jsx</text>
      <text x="170" y="34" font-size="9" fill="#94a3b8">Live execution state</text>
    </g>
  </g>

  <!-- Arrow L1 -> L2 -->
  <path d="M 390 210 L 420 210" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="405" y="200" font-size="9" font-family="monospace" fill="#60a5fa" text-anchor="middle">REST / JSON</text>

  <!-- LAYER 2: FASTAPI API GATEWAY -->
  <g transform="translate(430, 110)" filter="url(#glow)">
    <rect width="340" height="200" rx="12" fill="url(#emeraldCard)" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="26" font-size="12" font-weight="bold" fill="#34d399" letter-spacing="1">2. API GATEWAY &amp; ROUTING (FASTAPI)</text>

    <rect x="16" y="40" width="308" height="34" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="26" y="61" font-size="12" font-weight="600" fill="#f1f5f9">FastAPI Core Router (main.py)</text>

    <g transform="translate(16, 82)">
      <rect width="148" height="30" rx="6" fill="#0f172a" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="10" y="19" font-size="10" font-family="monospace" fill="#a7f3d0">/auth_routes</text>

      <rect x="160" width="148" height="30" rx="6" fill="#0f172a" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="170" y="19" font-size="10" font-family="monospace" fill="#a7f3d0">/prospect_routes</text>
    </g>

    <g transform="translate(16, 118)">
      <rect width="148" height="30" rx="6" fill="#0f172a" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="10" y="19" font-size="10" font-family="monospace" fill="#a7f3d0">/analysis_routes</text>

      <rect x="160" width="148" height="30" rx="6" fill="#0f172a" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="170" y="19" font-size="10" font-family="monospace" fill="#a7f3d0">/compare_routes</text>
    </g>

    <g transform="translate(16, 154)">
      <rect width="308" height="30" rx="6" fill="#0f172a" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="10" y="19" font-size="10" font-family="monospace" fill="#a7f3d0">/chat_routes (Context Q&amp;A)</text>
    </g>
  </g>

  <!-- Arrow L2 -> L3 -->
  <path d="M 770 210 L 800 210" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="785" y="200" font-size="9" font-family="monospace" fill="#34d399" text-anchor="middle">Invoke</text>

  <!-- LAYER 3: CORE DOMAIN SERVICES -->
  <g transform="translate(810, 110)" filter="url(#glow)">
    <rect width="340" height="200" rx="12" fill="url(#purpleCard)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="16" y="26" font-size="12" font-weight="bold" fill="#c084fc" letter-spacing="1">3. CORE DOMAIN SERVICES</text>

    <rect x="16" y="40" width="308" height="42" rx="6" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.4"/>
    <text x="26" y="58" font-size="11" font-weight="600" fill="#e9d5ff">analysis_service.py</text>
    <text x="26" y="72" font-size="9" fill="#94a3b8">Main underwriting synthesis pipeline</text>

    <rect x="16" y="88" width="308" height="42" rx="6" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.4"/>
    <text x="26" y="106" font-size="11" font-weight="600" fill="#e9d5ff">chat_service.py &amp; context_resolver</text>
    <text x="26" y="120" font-size="9" fill="#94a3b8">Conversational memory &amp; prompt context</text>

    <rect x="16" y="136" width="308" height="48" rx="6" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.4"/>
    <text x="26" y="154" font-size="11" font-weight="600" fill="#e9d5ff">comparison_service &amp; intent_service</text>
    <text x="26" y="168" font-size="9" fill="#94a3b8">Multi-prospect matrix &amp; user intent router</text>
  </g>

  <!-- Connector L3 Down to L4 & L5 -->
  <path d="M 980 310 L 980 340 L 220 340 L 220 360" stroke="#a855f7" stroke-width="2" fill="none" marker-end="url(#arrow-amber)"/>
  <text x="600" y="333" font-size="10" font-family="monospace" fill="#fbbf24" text-anchor="middle">Step 1: Run Multi-Source Research</text>

  <!-- LAYER 4: AUTONOMOUS RESEARCH ENGINE -->
  <g transform="translate(50, 370)" filter="url(#glow)">
    <rect width="520" height="240" rx="12" fill="url(#amberCard)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="16" y="26" font-size="12" font-weight="bold" fill="#fbbf24" letter-spacing="1">4. AUTONOMOUS DEEP RESEARCH ENGINE</text>

    <g transform="translate(16, 40)">
      <rect width="235" height="42" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.4"/>
      <text x="12" y="20" font-size="11" font-weight="600" fill="#fde68a">orchestrator.py</text>
      <text x="12" y="34" font-size="9" fill="#94a3b8">2-Stage probing &amp; early exit</text>

      <rect x="250" width="238" height="42" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.4"/>
      <text x="262" y="20" font-size="11" font-weight="600" fill="#fde68a">authority_ranker &amp; conflict_resolver</text>
      <text x="262" y="34" font-size="9" fill="#94a3b8">Credibility score &amp; deduplication</text>
    </g>

    <text x="16" y="102" font-size="10" font-weight="bold" fill="#d97706" letter-spacing="0.5">MULTI-SOURCE HARVESTER COLLECTORS</text>

    <g transform="translate(16, 110)">
      <rect width="154" height="34" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="10" y="21" font-size="10" fill="#f1f5f9">Tavily &amp; Serper APIs</text>

      <rect x="164" width="154" height="34" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="174" y="21" font-size="10" fill="#f1f5f9">Firecrawl Web Scraper</text>

      <rect x="328" width="160" height="34" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="338" y="21" font-size="10" fill="#f1f5f9">Official Web Scraper</text>
    </g>

    <g transform="translate(16, 150)">
      <rect width="154" height="34" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="10" y="21" font-size="10" fill="#f1f5f9">News &amp; Regulatory Harvester</text>

      <rect x="164" width="154" height="34" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="174" y="21" font-size="10" fill="#f1f5f9">SEC &amp; Financial Reports</text>

      <rect x="328" width="160" height="34" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="338" y="21" font-size="10" fill="#f1f5f9">Press Release Collector</text>
    </g>

    <rect x="16" y="194" width="472" height="30" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.3"/>
    <text x="252" y="213" font-size="10" font-weight="600" fill="#fde68a" text-anchor="middle">Output: Consolidate &amp; Rank Evidence by Authority Weight</text>
  </g>

  <!-- Arrow L4 -> L5 -->
  <path d="M 570 490 L 630 490" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="600" y="480" font-size="9" font-family="monospace" fill="#fbbf24" text-anchor="middle">Step 2: Evidence</text>

  <!-- LAYER 5: AI ENGINE & GUARDRAILS -->
  <g transform="translate(640, 370)" filter="url(#glow)">
    <rect width="510" height="240" rx="12" fill="url(#redCard)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="16" y="26" font-size="12" font-weight="bold" fill="#fca5a5" letter-spacing="1">5. AI ENGINE &amp; GUARDRAIL GATEWAY</text>

    <rect x="16" y="40" width="478" height="52" rx="6" fill="#0f172a" stroke="#ef4444" stroke-opacity="0.4"/>
    <text x="26" y="60" font-size="12" font-weight="600" fill="#fecdd3">LLM Provider Gateway (gemini.py / ollama.py)</text>
    <text x="26" y="78" font-size="10" fill="#94a3b8">• Gemini 3.6 Flash (Primary) • Lock Thread Safety • Min 4.0s Rate Spacing</text>

    <g transform="translate(16, 102)">
      <rect width="232" height="54" rx="6" fill="#0f172a" stroke="#ef4444" stroke-opacity="0.4"/>
      <text x="12" y="22" font-size="11" font-weight="600" fill="#fca5a5">validation_gateway.py</text>
      <text x="12" y="38" font-size="9" fill="#94a3b8">Enforces Pydantic schema contracts</text>

      <rect x="244" width="234" height="54" rx="6" fill="#0f172a" stroke="#ef4444" stroke-opacity="0.4"/>
      <text x="254" y="22" font-size="11" font-weight="600" fill="#fca5a5">output_guardrails.py</text>
      <text x="254" y="38" font-size="9" fill="#94a3b8">Fact-checking &amp; hallucination filter</text>
    </g>

    <rect x="16" y="166" width="478" height="54" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="26" y="186" font-size="11" font-weight="600" fill="#f1f5f9">Underwriting Report Synthesis</text>
    <text x="26" y="204" font-size="9" fill="#94a3b8">Generates Risk Scores, Executive Summary, SWOT, Financial Indicators &amp; Recommendations</text>
  </g>

  <!-- LAYER 6: DATA & PERSISTENCE LAYER -->
  <g transform="translate(50, 640)" filter="url(#glow)">
    <rect width="1100" height="160" rx="12" fill="url(#indigoCard)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="16" y="26" font-size="12" font-weight="bold" fill="#a5b4fc" letter-spacing="1">6. STORAGE, PERSISTENCE &amp; SECURITY LAYER (POSTGRESQL + SQLALCHEMY)</text>

    <g transform="translate(16, 42)">
      <rect width="255" height="96" rx="8" fill="#0f172a" stroke="#6366f1" stroke-opacity="0.4"/>
      <text x="14" y="24" font-size="11" font-weight="600" fill="#c7d2fe">User Model (user.py)</text>
      <text x="14" y="42" font-size="9" fill="#94a3b8">• UUID Primary Key Security</text>
      <text x="14" y="58" font-size="9" fill="#94a3b8">• JWT Bearer Authentication</text>
      <text x="14" y="74" font-size="9" fill="#94a3b8">• Role Permissions &amp; Audit Logs</text>

      <rect x="278" width="255" height="96" rx="8" fill="#0f172a" stroke="#6366f1" stroke-opacity="0.4"/>
      <text x="290" y="24" font-size="11" font-weight="600" fill="#c7d2fe">Prospect Model (prospect.py)</text>
      <text x="290" y="42" font-size="9" fill="#94a3b8">• Target Domain &amp; Entity Name</text>
      <text x="290" y="58" font-size="9" fill="#94a3b8">• Industry &amp; Size Metadata</text>
      <text x="290" y="74" font-size="9" fill="#94a3b8">• Execution Lifecycle Status</text>

      <rect x="540" width="265" height="96" rx="8" fill="#0f172a" stroke="#6366f1" stroke-opacity="0.4"/>
      <text x="552" y="24" font-size="11" font-weight="600" fill="#c7d2fe">Analysis Model (analysis.py)</text>
      <text x="552" y="42" font-size="9" fill="#94a3b8">• Structured AI Underwriting Report</text>
      <text x="552" y="58" font-size="9" fill="#94a3b8">• Composite Risk Score Matrix</text>
      <text x="552" y="74" font-size="9" fill="#94a3b8">• Historical Underwriting Snapshot</text>

      <rect x="812" width="272" height="96" rx="8" fill="#0f172a" stroke="#6366f1" stroke-opacity="0.4"/>
      <text x="824" y="24" font-size="11" font-weight="600" fill="#c7d2fe">Evidence Model (evidence.py)</text>
      <text x="824" y="42" font-size="9" fill="#94a3b8">• Source URLs &amp; Citation Snippets</text>
      <text x="824" y="58" font-size="9" fill="#94a3b8">• Authority Weight Scores</text>
      <text x="824" y="74" font-size="9" fill="#94a3b8">• Parameter Traceability Mapping</text>
    </g>
  </g>
</svg>
